name: Publish to npm

on:
  push:
    branches: [main]
  # Six releases were lost to a credential this workflow could not check, and
  # recovering from that took a no-op commit because a push was the only way in.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if the push was made by the github-actions bot (version bump commit)
    # to avoid an infinite loop.
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v5
        with:
          # Use GITHUB_TOKEN with write permission so git push works
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # index.json is generated from the SKILL.md frontmatter, but nothing ever
      # ran the generator in CI — README asks contributors to run it by hand
      # before opening a PR. It happened to be in sync; nothing made it stay
      # that way, and index.json is what find_skill, the marketplace plugin and
      # docsbook.io all read. Regenerate and fail if the committed file differs,
      # so a stale catalog cannot be published.
      - name: Rebuild index and fail if it drifted
        run: |
          node scripts/build-index.js
          if ! git diff --quiet -- index.json; then
            echo "::error::index.json is stale — run 'npm run build-index' and commit the result."
            git --no-pager diff -- index.json
            exit 1
          fi

      # The catalog's own guardrails. A skill states the need, not the tool —
      # without a gate that rule decays silently (it was 22 of 43 skills once).
      # Nothing publishes if the catalog contradicts what the README promises.
      - name: Check catalog
        run: node scripts/check-catalog.js

      # Prove the credential can publish BEFORE anything is written to main.
      # Six releases (1.8.30 … 1.8.35) died on `E404 PUT
      # registry.npmjs.org/docs-skills` — the 404 npm returns for "this token
      # may not publish that package" just as readily as for "no such package",
      # so the message pointed nowhere. The failure was invisible because the
      # bump was committed and pushed one step earlier: main advertised six
      # releases the registry never received, and every downstream consumer
      # pinning the npm version froze at 1.8.29 while looking current.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret is unset or empty. Create an npm automation token with publish rights on 'docs-skills' and store it as the NPM_TOKEN repository secret."
            exit 1
          fi

          if ! WHOAMI=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is not a usable npm credential (npm whoami said: ${WHOAMI}). It has most likely expired or been revoked — issue a new automation token at https://www.npmjs.com/settings/~/tokens and update the NPM_TOKEN secret."
            exit 1
          fi
          echo "authenticated to npm as ${WHOAMI}"

          PKG=$(node -p "require('./package.json').name")
          # A live token belonging to an account that is not a maintainer fails
          # exactly like an expired one — same 404, at the last step. Say which
          # it is here instead.
          if npm view "$PKG" version >/dev/null 2>&1; then
            if ! npm view "$PKG" maintainers --json | grep -q "\"${WHOAMI} "; then
              echo "::error::npm token authenticates as '${WHOAMI}', who is not a maintainer of '${PKG}'. Publishing would fail with a misleading 404. Add ${WHOAMI} as a maintainer, or issue the token from an account that already is."
              exit 1
            fi
          fi

      # The next version is one patch above whichever of the two sources is
      # ahead — the committed package.json or what the registry actually holds.
      # They diverged by six patches while publishing was broken, and a bump
      # computed from package.json alone stays wrong in the opposite direction
      # the first time a publish succeeds and the follow-up push does not.
      - name: Decide the next version
        id: version
        run: |
          PKG=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PKG" version 2>/dev/null || echo "0.0.0")
          echo "package.json: ${LOCAL} · registry: ${PUBLISHED}"

          NEXT=$(node -e '
            const parse = (v) => String(v || "0.0.0").split("-")[0].split(".").map((n) => Number(n) || 0)
            const [a, b] = [parse(process.argv[1]), parse(process.argv[2])]
            const ahead = [0, 1, 2].reduce((acc, i) => acc !== 0 ? acc : a[i] - b[i], 0) >= 0 ? a : b
            process.stdout.write([ahead[0], ahead[1], ahead[2] + 1].join("."))
          ' "$LOCAL" "$PUBLISHED")

          echo "next: ${NEXT}"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Set the version
        run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version

      # Publish first, record second. A failed upload now costs nothing: the
      # bump lives only in the runner's working tree and main is untouched, so
      # the next push retries the same version instead of stepping over it.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Record the release on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.next }} [skip ci]"
          # main can have moved during the upload; rebase rather than fail a
          # release that npm has already accepted and cannot accept twice.
          git pull --rebase origin main
          git push origin HEAD:main
