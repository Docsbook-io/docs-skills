name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if the push was made by the github-actions bot (version bump commit)
    # to avoid an infinite loop.
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          # Use GITHUB_TOKEN with write permission so git push works
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # The catalog's own guardrails. A skill states the need, not the tool —
      # without a gate that rule decays silently (it was 22 of 43 skills once).
      # Nothing publishes if the catalog contradicts what the README promises.
      - name: Check catalog
        run: node scripts/check-catalog.js

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v$(node -p "require('./package.json').version") [skip ci]"
          git push

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
