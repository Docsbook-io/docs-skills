name: Notify docs-claude-plugins

# The plugin repository vendors this catalog: it pins a docs-skills commit,
# copies the skill tree in, and byte-checks it. Moving that pin was left to an
# hourly cron, and GitHub's scheduler is not an hourly guarantee — on a quiet
# repository it skips. Measured on 2026-08-29: the sync ran at 03:43 UTC and not
# once in the five hours after it, so a catalog merged at 08:10 would have sat
# unsynced for an unbounded time, which is the same "the pin sat still while
# upstream released five times" failure the cron was added to end.
#
# A push to main is the event that actually makes the plugin stale, so it is the
# event that should start the sync. The cron stays in the plugin repository as
# the backstop for when this notification is the thing that fails.
#
# Deliberately its own workflow rather than a step in publish.yml: publishing to
# npm depends on a credential that has broken before, and the catalog the plugin
# reads comes from git, not from npm. A broken publish must not also stop the
# sync.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify-plugins
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # The bot's own "chore: release" commit changes no skill file, so it has
    # nothing to sync and would only start a second, identical run.
    if: github.actor != 'github-actions[bot]'

    steps:
      # GITHUB_TOKEN is scoped to this repository and cannot dispatch into
      # another one, so this needs a token of its own: a fine-grained PAT (or a
      # GitHub App installation token) with `contents: write` on
      # Docsbook-io/docs-claude-plugins, stored here as PLUGINS_DISPATCH_TOKEN.
      #
      # Missing secret fails the job rather than skipping quietly. A skip would
      # leave the repository looking green while the guarantee in this file's
      # name is not being kept — which is precisely how the pin went stale for
      # eleven days the first time. The hourly cron in the plugin repository
      # still covers the gap in the meantime, so a red run here means "the fast
      # path is not wired", never "the plugin is broken".
      - name: Tell the plugin repository that main moved
        env:
          TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::PLUGINS_DISPATCH_TOKEN is not set. Create a fine-grained PAT with 'contents: write' on Docsbook-io/docs-claude-plugins and add it as this repository's PLUGINS_DISPATCH_TOKEN secret. Until then docs-claude-plugins only picks this catalog up on its hourly cron, which GitHub does not run reliably."
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Docsbook-io/docs-claude-plugins/dispatches \
            -d "$(node -p 'JSON.stringify({ event_type: "upstream-updated", client_payload: { sha: process.env.SHA, repo: "Docsbook-io/docs-skills" } })')")
          if [ "${CODE}" != "204" ]; then
            echo "HTTP ${CODE}"
            cat /tmp/dispatch.out
            case "${CODE}" in
              401|403) echo "::error::The dispatch was rejected (HTTP ${CODE}). PLUGINS_DISPATCH_TOKEN is expired, or lacks 'contents: write' on Docsbook-io/docs-claude-plugins." ;;
              404)     echo "::error::GitHub answered 404. For a repository that exists this means the token cannot see it — a fine-grained PAT must list docs-claude-plugins among its repositories, not only the organisation." ;;
              *)       echo "::error::The dispatch failed with HTTP ${CODE} — see the body above." ;;
            esac
            exit 1
          fi
          echo "dispatched upstream-updated for ${SHA}"
